name: launcher
on:
  push:
    paths: ['launcher/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/launcher.yml']

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Ações de terceiros fixadas por commit (o instalador é gerado sob elas).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher/src-tauri -> target
      - run: npm ci
      - run: npm test -w launcher/ui
      - run: npm run typecheck -w launcher/ui
      # O `generate_context!` exige a UI compilada antes de compilar o Rust.
      - run: npm run build -w launcher/ui
      # CSP: nada inline nem remoto na UI compilada (o `tauri dev` não aplica a CSP).
      - run: npm run check:dist -w launcher/ui
      - run: cargo test --locked
        working-directory: launcher/src-tauri
      # Perfil de teste local (Hub em 127.0.0.1, servidores em LAN): mesmos testes com a feature ligada.
      - run: cargo test --locked --features local-test
        working-directory: launcher/src-tauri
      # Build comum sem chave de updater: só o workflow de release liga createUpdaterArtifacts e assina.
      # bash (Git Bash do runner): passa o JSON intacto até a CLI, como no build local.
      - run: npm run tauri -w launcher/ui -- build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cb-multiplayer-nsis
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # Instalador de TESTE LOCAL ("CB Multiplayer (Teste local)", Hub em http://127.0.0.1:8787): só para os testes
      # manuais com tools/dev-env.mjs; nunca publicado. A pasta do bundle é limpa antes para não misturar os dois.
      - run: rm -rf target/release/bundle/nsis
        shell: bash
        working-directory: launcher/src-tauri
      - run: npm run tauri -w launcher/ui -- build --ci --features local-test --config ../src-tauri/tauri.localtest.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cb-multiplayer-teste-local-nsis
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
