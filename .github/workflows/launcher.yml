name: launcher
# O e2e também depende do Hub, do cb-server (e do que ele compila) e do tools/dev-env.mjs.
on:
  push:
    paths: ['launcher/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/launcher.yml',
      'hub/**', 'server/**', 'proto/**', 'tools/dev-env.mjs', 'resources.example/hello-client/**', 'CMakeLists.txt',
      'CMakePresets.json', 'vcpkg.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**']
  pull_request:
    paths: ['launcher/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/launcher.yml',
      'hub/**', 'server/**', 'proto/**', 'tools/dev-env.mjs', 'resources.example/hello-client/**', 'CMakeLists.txt',
      'CMakePresets.json', 'vcpkg.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**']

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Ações de terceiros fixadas por commit (o instalador é gerado sob elas).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher/src-tauri -> target
      - run: npm ci
      - run: npm test -w launcher/ui
      - run: npm run typecheck -w launcher/ui
      # O `generate_context!` exige a UI compilada antes de compilar o Rust.
      - run: npm run build -w launcher/ui
      # CSP: nada inline nem remoto na UI compilada (o `tauri dev` não aplica a CSP).
      - run: npm run check:dist -w launcher/ui
      - run: cargo test --locked
        working-directory: launcher/src-tauri
      # Perfil de teste local (Hub em 127.0.0.1, servidores em LAN): mesmos testes com a feature ligada.
      - run: cargo test --locked --features local-test
        working-directory: launcher/src-tauri
      # Assinador do workflow de release (crate próprio, Cargo.lock próprio).
      - run: cargo test --locked
        working-directory: launcher/release-signer
      # Build comum sem chave de updater: só o workflow de release liga createUpdaterArtifacts e assina.
      # bash (Git Bash do runner): passa o JSON intacto até a CLI, como no build local.
      - run: npm run tauri -w launcher/ui -- build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        shell: bash
      # Tripwire: o binário oficial não pode carregar nada do perfil de teste local (Hub local, nome, pasta).
      - run: |
          for s in '127.0.0.1:8787' 'Teste local' 'localtest' 'TesteLocal'; do
            if grep -q -a -F "$s" CBMultiplayer.exe; then echo "binário oficial contém '$s'"; exit 1; fi
          done
        shell: bash
        working-directory: launcher/src-tauri/target/release
      - uses: actions/upload-artifact@v4
        with:
          name: cb-multiplayer-nsis
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # Instalador de TESTE LOCAL ("CB Multiplayer (Teste local)", Hub em http://127.0.0.1:8787): só para os testes
      # manuais com tools/dev-env.mjs; nunca publicado. A pasta do bundle é limpa antes para não misturar os dois.
      - run: rm -rf target/release/bundle/nsis
        shell: bash
        working-directory: launcher/src-tauri
      - run: npm run tauri -w launcher/ui -- build --ci --features local-test --config ../src-tauri/tauri.localtest.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        shell: bash
      - run: grep -q -a -F '127.0.0.1:8787' CBMultiplayerTesteLocal.exe
        shell: bash
        working-directory: launcher/src-tauri/target/release
      - uses: actions/upload-artifact@v4
        with:
          name: cb-multiplayer-teste-local-nsis
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Ponta a ponta (tests/e2e.rs): Hub real (node) + cb-server real com hello-client, via tools/dev-env.mjs; login de dev,
  # play em modo simular e conteúdo montado = manifest. O cb-server é compilado aqui (só o alvo), com o cache de
  # binários do vcpkg que o job windows do workflow native grava (só leitura aqui; sem cache, compila as dependências).
  e2e:
    runs-on: windows-2025
    # Sem cache do vcpkg (primeira execução numa branch) as dependências compilam do zero (~80 min).
    timeout-minutes: 150
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
      # Mesmo commit do vcpkg do workflow native (manter os dois iguais, senão o cache não serve).
      VCPKG_COMMIT: ec48c11eae9448c8c6e7739d93e06fa2433aa95f
    steps:
      - uses: actions/checkout@v4
      - id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-win-${{ hashFiles('vcpkg.json') }}-
            vcpkg-win-
      - run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/vcpkg"
          git -C "$env:GITHUB_WORKSPACE/vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh
      - run: cmake --preset windows-ci && cmake --build --preset windows-ci --target cb-server
        shell: pwsh
      # Salva o que compilou quando não havia cache exato, para a próxima execução não recompilar tudo.
      - if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher/src-tauri -> target
      # Hub roda com o tsx de node_modules; o `generate_context!` exige a UI compilada.
      - run: npm ci
      - run: npm run build -w launcher/ui
      # CBMP_E2E=1: sem o cb-server o teste falha (em vez de ser pulado).
      - run: cargo test --locked --test e2e -- --nocapture
        working-directory: launcher/src-tauri
        env:
          CBMP_E2E: '1'
          CBMP_CB_SERVER: ${{ github.workspace }}/build-native/windows-ci/server/Release/cb-server.exe
