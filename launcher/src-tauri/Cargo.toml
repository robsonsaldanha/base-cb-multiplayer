[package]
name = "cbmp-launcher"
version = "0.1.0"
description = "CB Multiplayer — launcher"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "cbmp_launcher_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
toml = "=1.2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
