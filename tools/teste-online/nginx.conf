# CB Multiplayer (ambiente de TESTE online): Hub em https://cbmultiplayer.cntoficial.com.br (Cloudflare → nginx →
# 127.0.0.1:8787). Fonte: tools/teste-online/nginx.conf; instalado por remote-install.sh. docs/AMBIENTE-TESTE-ONLINE.md
server {
    listen 80;
    listen [::]:80;
    server_name cbmultiplayer.cntoficial.com.br;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Renovação do certificado (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html_cbmultiplayer/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cbmultiplayer.cntoficial.com.br;
    ssl_certificate /etc/letsencrypt/live/cbmultiplayer.cntoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbmultiplayer.cntoficial.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # IP real do visitante atrás da Cloudflare ($remote_addr passa a ser o CF-Connecting-IP, só vindo de IPs dela).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 64k;

    # Instalador dos testadores (docs/TESTE-ONLINE.md): arquivo estático, fora do Hub.
    location = /CB-Multiplayer-Teste-setup.exe {
        root /var/www/html_cbmultiplayer/download;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment; filename=\"CB-Multiplayer-Teste-setup.exe\"" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /CB-Multiplayer-Teste-setup.exe.sha256 {
        root /var/www/html_cbmultiplayer/download;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Substitui (não acrescenta): o Hub confia só em 127.0.0.1 (HUB_TRUST_PROXY) e lê daqui o IP do visitante.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Downloads de releases (/v1/dl): sem buffer no nginx, para os limites de taxa/parada do Hub valerem.
    location /v1/dl/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
