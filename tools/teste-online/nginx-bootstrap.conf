# CB Multiplayer (ambiente de TESTE online) — fase 1, antes do certificado: só o desafio ACME na porta 80.
# Fonte: tools/teste-online/nginx-bootstrap.conf. Trocado por nginx.conf depois do certbot (remote-install.sh).
server {
    listen 80;
    listen [::]:80;
    server_name cbmultiplayer.cntoficial.com.br;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html_cbmultiplayer/acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
